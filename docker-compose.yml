services:
  # Local PostgreSQL Database for LiteLLM Key Management & Spend Tracking
  # (Note: If using external Supabase, you can comment out or stop this container)
  db:
    image: postgres:16.8-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_postgres_password_here}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - litellm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d litellm || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # LiteLLM Proxy Server
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.61.1
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-your_postgres_password_here}@db:5432/litellm}
      LITELLM_MASTER_KEY: ${MASTER_KEY:-sk-your-secure-and-long-master-key-here}
      STORE_MODEL_IN_DB: "True"
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--detailed_debug"
    networks:
      - litellm-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
        required: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus Metrics Collector (Observability)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: litellm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - litellm-network
    depends_on:
      - litellm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  litellm-network:
    driver: bridge

volumes:
  postgres_data:
