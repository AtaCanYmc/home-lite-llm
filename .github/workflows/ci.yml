name: CI & Configuration Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Configurations & Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml yamllint ruff

      - name: Lint YAML Files
        run: yamllint -c .yamllint.yml .

      - name: Lint Python Scripts with Ruff
        run: ruff check scripts/validate_config.py

      - name: Validate config.yaml and Environment
        run: python3 scripts/validate_config.py --env .env.example

      - name: Validate Bash Scripts Syntax
        run: |
          bash -n quickstart.sh
          bash -n scripts/backup_db.sh
          bash -n scripts/restore_db.sh
          bash -n tunnels/cloudflare/start-cloudflare.sh
          bash -n tunnels/ngrok/start-ngrok.sh
          bash -n tunnels/tailscale/start-tailscale.sh

      - name: Create Environment File for CI
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Validate Postman and Bruno Collections JSON
        run: |
          python3 -m json.tool collections/postman/LiteLLM_Gateway.postman_collection.json > /dev/null
          python3 -m json.tool collections/postman/LiteLLM_Local_Environment.postman_environment.json > /dev/null
          python3 -m json.tool collections/bruno/bruno.json > /dev/null

      - name: Validate Internal Documentation Links
        run: |
          python3 -c '
          import re, glob, os

          def check_file(f):
              content = open(f, encoding="utf-8").read()
              content = re.sub(r"```[\s\S]*?```", "", content)
              content = re.sub(r"`[^`]*`", "", content)
              links = re.findall(r"\[.*?\]\((?!https?://|mailto:)(.*?)(?:#.*)?\)", content)
              broken = []
              for link in links:
                  link = link.strip()
                  if not link or link.startswith("#"): continue
                  target = os.path.normpath(os.path.join(os.path.dirname(f), link))
                  if not os.path.exists(target):
                      broken.append(f"{f} -> {link} (resolved: {target})")
              return broken

          all_broken = []
          for md in glob.glob("**/*.md", recursive=True):
              if ".venv" in md or "node_modules" in md: continue
              all_broken.extend(check_file(md))

          if all_broken:
              print("Broken relative links detected:")
              for b in all_broken:
                  print(" - " + b)
              exit(1)
          print("All internal markdown links verified.")
          '
