name: Feature Request
description: Propose a new model provider, tool integration, or architectural enhancement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify that this proposal is not already tracked in existing issues or roadmap discussions.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the technical limitation or operational friction this feature addresses.
      placeholder: I encounter an issue or limitation when...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Detail the requested behavior, configuration schema, or endpoint changes.
      placeholder: Add support for provider or runtime...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternative solutions or workarounds evaluated.
  - type: checkboxes
    id: checklist
    attributes:
      label: Contributor Checklist
      options:
        - label: I searched existing issues and discussions before submitting.
          required: true
        - label: This proposal maintains backwards compatibility with existing Compose setups.
          required: true
