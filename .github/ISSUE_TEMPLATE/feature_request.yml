name: Feature Request
description: Propose a new integration, CLI command, or monitoring enhancement
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Concrete implementation or configuration change.
    validations:
      required: true
