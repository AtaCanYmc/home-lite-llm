name: Bug Report
description: Report a defect in configuration, scripts, or container setup
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Concise summary of the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands (`hlm ...`, `make ...`, `docker compose ...`) and error output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15 / Ubuntu 24.04, Docker 27.x, hlm 1.3.1"
    validations:
      required: true
