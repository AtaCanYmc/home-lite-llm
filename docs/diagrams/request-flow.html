<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>home-lite-llm — Request &amp; Failover Flow</title>
<style>
  :root {
    --paper: #f5f5f5;
    --surface: #ffffff;
    --ink: #2d3142;
    --muted: #6b7280;
    --border: #d1d5db;
    --accent: #bf4520;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    max-width: 900px;
    width: 100%;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>Request &amp; Spend Tracking Flow</h1>
  <p class="subtitle">End-to-end sequence from client request through virtual key validation, upstream routing, and PostgreSQL spend logging.</p>
  <svg viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3142"/>
      </marker>
    </defs>

    <!-- Participants -->
    <rect x="40" y="20" width="140" height="44" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <text x="110" y="47" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3142">Client / IDE / CLI</text>

    <rect x="250" y="20" width="160" height="44" rx="5" fill="#fff5f2" stroke="#bf4520" stroke-width="2"/>
    <text x="330" y="47" text-anchor="middle" font-size="12" font-weight="700" fill="#bf4520">LiteLLM Gateway (:4000)</text>

    <rect x="470" y="20" width="140" height="44" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <text x="540" y="47" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3142">PostgreSQL (:5432)</text>

    <rect x="660" y="20" width="150" height="44" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <text x="735" y="47" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3142">Upstream Provider</text>

    <!-- Lifelines -->
    <line x1="110" y1="64" x2="110" y2="350" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="330" y1="64" x2="330" y2="350" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="540" y1="64" x2="540" y2="350" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="735" y1="64" x2="735" y2="350" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Messages -->
    <line x1="110" y1="100" x2="328" y2="100" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="219" y="92" text-anchor="middle" font-size="11" fill="#2d3142">1. POST /v1/chat/completions</text>

    <line x1="330" y1="140" x2="538" y2="140" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="434" y="132" text-anchor="middle" font-size="11" fill="#2d3142">2. Validate Key &amp; Budget</text>

    <line x1="540" y1="180" x2="332" y2="180" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="434" y="172" text-anchor="middle" font-size="11" fill="#6b7280">3. Key Valid</text>

    <line x1="330" y1="220" x2="733" y2="220" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="532" y="212" text-anchor="middle" font-size="11" fill="#2d3142">4. Forward Request (with 429 Failover)</text>

    <line x1="735" y1="260" x2="332" y2="260" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="532" y="252" text-anchor="middle" font-size="11" fill="#6b7280">5. Stream / Token Payload</text>

    <line x1="330" y1="300" x2="538" y2="300" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="434" y="292" text-anchor="middle" font-size="11" fill="#2d3142">6. Record Token Spend</text>

    <line x1="330" y1="335" x2="112" y2="335" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="219" y="327" text-anchor="middle" font-size="11" font-weight="600" fill="#bf4520">7. 200 OK (OpenAI JSON)</text>
  </svg>
</div>
</body>
</html>
