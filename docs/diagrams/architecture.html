<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>home-lite-llm — System Architecture</title>
<style>
  :root {
    --paper: #f5f5f5;
    --surface: #ffffff;
    --ink: #2d3142;
    --muted: #6b7280;
    --border: #d1d5db;
    --accent: #bf4520;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    max-width: 960px;
    width: 100%;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>home-lite-llm System Architecture</h1>
  <p class="subtitle">Localhost-bound OpenAI-compatible gateway, isolated PostgreSQL spend store, and Prometheus/Grafana telemetry.</p>
  <svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3142"/>
      </marker>
    </defs>

    <!-- Clients -->
    <rect x="30" y="155" width="180" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <text x="120" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">Clients &amp; IDEs</text>
    <text x="120" y="208" text-anchor="middle" font-size="11" fill="#6b7280">Cursor, Continue, Aider,</text>
    <text x="120" y="224" text-anchor="middle" font-size="11" fill="#6b7280">dsh, SDKs, Bruno</text>

    <!-- LiteLLM Gateway (Focal) -->
    <rect x="300" y="145" width="220" height="110" rx="6" fill="#fff5f2" stroke="#bf4520" stroke-width="2"/>
    <text x="410" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#bf4520">LiteLLM Proxy Gateway</text>
    <text x="410" y="202" text-anchor="middle" font-size="11" fill="#2d3142">127.0.0.1:4000 (/v1)</text>
    <text x="410" y="222" text-anchor="middle" font-size="11" fill="#6b7280">Auth, Budgets, 429 Failover</text>

    <!-- PostgreSQL -->
    <rect x="315" y="310" width="190" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <text x="410" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">PostgreSQL (:5432)</text>
    <text x="410" y="362" text-anchor="middle" font-size="11" fill="#6b7280">Isolated Docker Network</text>

    <!-- Cloud Providers -->
    <rect x="615" y="65" width="230" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <text x="730" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">Cloud Providers</text>
    <text x="730" y="116" text-anchor="middle" font-size="11" fill="#6b7280">OpenAI, Anthropic, Gemini,</text>
    <text x="730" y="132" text-anchor="middle" font-size="11" fill="#6b7280">Grok, Groq, DeepSeek</text>

    <!-- Local Inference -->
    <rect x="615" y="175" width="230" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <text x="730" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">Local Inference</text>
    <text x="730" y="226" text-anchor="middle" font-size="11" fill="#6b7280">Ollama, LM Studio, vLLM</text>

    <!-- Prometheus -->
    <rect x="30" y="30" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <text x="120" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">Prometheus (:9090)</text>
    <text x="120" y="80" text-anchor="middle" font-size="11" fill="#6b7280">Scrapes /metrics</text>

    <!-- Grafana -->
    <rect x="315" y="30" width="190" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <text x="410" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">Grafana (:3001)</text>
    <text x="410" y="80" text-anchor="middle" font-size="11" fill="#6b7280">PromQL Dashboards</text>

    <!-- Connections -->
    <line x1="210" y1="200" x2="298" y2="200" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="254" y="192" text-anchor="middle" font-size="10" fill="#6b7280">HTTP /v1</text>

    <line x1="410" y1="255" x2="410" y2="308" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="458" y="286" font-size="10" fill="#6b7280">Spend &amp; Auth</text>

    <line x1="520" y1="180" x2="613" y2="112" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="520" y1="215" x2="613" y2="215" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="568" y="136" text-anchor="middle" font-size="10" fill="#6b7280">Route</text>

    <line x1="120" y1="102" x2="300" y2="170" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <line x1="315" y1="66" x2="212" y2="66" stroke="#2d3142" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="263" y="58" text-anchor="middle" font-size="10" fill="#6b7280">PromQL</text>
  </svg>
</div>
</body>
</html>
